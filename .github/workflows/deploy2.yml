name: Desplegament a EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. Este job compila la imagen y la sube a Docker Hub
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:${{ github.sha }}

  # 2. Este job se ejecuta SOLO si el de arriba termina bien, copia los ficheros y levanta el contenedor
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar fitxers al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.override.yml,Dockerfile,src/,db/"
          target: ~/taskmanager

      - name: Construir i arrencar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/taskmanager
            export IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/taskmanager:${{ github.sha }}
            export PORT=80
            
            # Ahora el pull no fallará porque el job 'build' ya habrá subido la imagen
            docker pull $IMAGE
            docker compose up -d
